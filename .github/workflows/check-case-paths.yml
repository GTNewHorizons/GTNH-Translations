name: Check paths and tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python .github/scripts/check_case_paths.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: snok/install-poetry@v1
      - name: Install test dependencies
        run: poetry install --only main,test --no-interaction
      - name: Run tests
        run: poetry run pytest -q
        env:
          PARATRANZ_PROJECT_ID: '1'
          PARATRANZ_TOKEN: test-only
